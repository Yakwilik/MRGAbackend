apiVersion: apps/v1
kind: Deployment
metadata:
  name: speranskiy-backend-deployment
  labels:
    app: speranskiy-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: speranskiy-backend
  template:
    metadata:
      labels:
        app: speranskiy-backend
    spec:
      containers:
        - name: speranskiy-backend
          image: yakwilik/speranskiy_backend
          ports:
            - containerPort: 7001
            - containerPort: 7002
          envFrom:
          - configMapRef:
              name: db-config
          env:
          - name: DBPassword
            valueFrom:
              secretKeyRef:
                name: db-password-secret
                key: DBPassword
          - name: x-app-bot-auth-token
            valueFrom:
              secretKeyRef:
                key: x-app-bot-auth-token
                name: bot-api-token
