syntax = "proto3";

package mrga.backend;

option go_package="mrga/service/backend";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

import "gnostic/openapi/v3/openapiv3.proto";
import "gnostic/openapi/v3/annotations.proto";

option (gnostic.openapi.v3.document) = {
  info: {
    title: "Speranskiy";
    version: "1.0";
  };
  servers: [
    {
      url: "{scheme}://{host}:{port}/{base_url}";
      variables: {
        additional_properties :[
        {
          name: "port";
          value: {
            enum: [
              "80",
              "7001",
              "443"
            ];
            default: "7001";
          };
        },
        {
          name: "scheme";
          value: {
            enum: [
              "http",
              "https"
            ];
            default: "http";
          };
        },
        {
          name: "host";
          value: {
            enum: [
              "localhost",
              "194.61.3.193",
              "yurist-bot.com"
            ];
            default: "localhost";
          };
        },
        {
          name: "base_url";
          value: {
            enum: [
              "api/gateway"
            ];
            default: "api/gateway";
          };
        }
      ];
    };
    }
  ];
};

service Backend{
  rpc SignUPV1 (SignUPRequest) returns (SignUPResponse){
    option (google.api.http) = {
      post: "/v1/sign_up"
      body: "*"
    };
  }

  rpc Login (LoginRequest) returns (LoginResponse){
    option(google.api.http) = {
      post: "/v1/login"
      body: "*"
    };
  }

  rpc CheckLogin (CheckLoginRequest) returns (CheckLoginResponse){
    option(google.api.http) = {
      get: "/v1/check_login"
    };
  }

  rpc BeginConversation(BeginConversationRequest) returns (BeginConversationResponse) {
    option(google.api.http) = {
      post: "/v1/chat/begin"
      body: "*"
    };
    option deprecated = true;
  }

  rpc GetConversations(GetConversationsRequest) returns (GetConversationsResponse) {
    option(google.api.http) = {
      get: "/v1/chats"
    };
  }

  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse) {
    option(google.api.http) = {
      get: "/v1/chats/{id}"
    };
  }

  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse){
    option(google.api.http) = {
      post: "/v1/chats/{chat_id}/send"
      body: "*"
    };
    option deprecated = true;
  }

  rpc SendMessageV2(SendMessageRequest) returns (stream MessageV2){
    option(google.api.http) = {
      post: "/v2/chats/{chat_id}/send"
      body: "*"
    };
    option deprecated = true;
  }

  rpc GetDocumentCategories(GetCategoriesRequest) returns (GetCategoriesResponse) {
    option(google.api.http) = {
      get: "/v1/documents/categories"
    };
  }

  rpc GetDocumentInfoByKey(GetDocumentInfoByKeyRequest) returns (GetDocumentInfoByKeyResponse) {
    option(google.api.http) = {
      get: "/v1/documents/by_key/{key}"
    };
  }


  rpc SendRedirectSuggest(SendRedirectSuggestRequest) returns (SendRedirectSuggestResponse) {
    option(google.api.http) = {
      post: "/v1/suggest_redirect"
      body: "*"
    };
  }

  rpc GetHotThemes(GetHotThemesRequest) returns (GetHotThemesResponse) {
    option(google.api.http) = {
      get: "/v1/chat/hot_themes"
    };
  }

  rpc AddDocumentCategory(AddDocumentCategoryRequest) returns (AddDocumentCategoryResponse){
    option(google.api.http) = {
      post: "/v1/documents/categories/add"
      body: "*"
    };
  }

  rpc AddDocumentTypes(AddDocumentTypesRequest) returns (AddDocumentTypesResponse){
    option(google.api.http) = {
      post: "/v1/documents/types/add"
      body: "*"
    };
  }

  rpc AddDocumentVariants(DocumentType) returns (AddDocumentVariantsResponse){
    option(google.api.http) = {
      post: "/v1/documents/variants/add"
      body: "*"
    };
  }


  rpc TestStreamFromServer(TestMessageRequest) returns (stream TestMessageResponse) {
    option(google.api.http) = {
      post: "/v1/test_stream_from_server"
      body: "*"
    };
  }

  rpc TestStreamFromClient(stream TestMessageRequest) returns (TestMessageResponse) {
    option(google.api.http) = {
      post: "/v1/test_stream_from_client"
      body: "*"
    };
  }

  rpc TestStreamClientAndServer(stream TestMessageRequest) returns (stream TestMessageResponse) {
    option(google.api.http) = {
      post: "/v1/test_stream_client_and_server"
      body: "*"
    };
  }
}

message TestMessageRequest{
  string data = 1;
}

message TestMessageResponse{
  string data = 1;
}

message GetHotThemesRequest {
}

message GetHotThemesResponse {
  repeated string actualThemes = 1;
}
message SendRedirectSuggestRequest{
  uint32 chat_id = 1;
  string action = 2;
  string document_id = 3;
}

message SendRedirectSuggestResponse{}

message GetCategoriesRequest {}

message GetDocumentInfoByKeyRequest {
  string key = 1;
}

message GetDocumentInfoByKeyResponse {
  string key = 1;
  string category = 2;
  string type = 3;
  string name = 4;
}

message GetCategoriesResponse {
  repeated DocumentCategory categories = 1;
}

message DocumentCategory {
  string categoryName = 1;
  repeated DocumentType documentTypes = 2;
}

message DocumentType {
  string type = 1;
  repeated DocumentVariant variants = 2;
}

message DocumentVariant {
  string key = 1;
  string name = 2;
}

message NewMessage {
  string message = 1;
  google.protobuf.Timestamp sent_at = 3;
}

message SendMessageRequest{
  uint32 chat_id = 1;
  NewMessage msg = 2;
}

message SendMessageResponse{}

message BeginConversationRequest {
  NewMessage msg = 1;
}

message BeginConversationResponse{
  uint32 chat_id = 1;
}

message GetConversationsRequest{

}

message Conversation {
  string last_message = 1;
  bool from_chatbot = 2;
  google.protobuf.Timestamp sent_at = 3;
  uint32 chat_id = 4;
  string chat_name = 5;
  MessageRole role = 6;
}

message GetConversationsResponse{
  repeated Conversation conversations = 1;
}

message Message {
  string message = 1;
  bool from_chatbot = 2;
  google.protobuf.Timestamp sent_at = 3;
  MessageRole role = 4;
}

// Enum для определения роли сообщения
enum MessageRole {
  user = 0;       // Сообщение от пользователя
  assistant = 1;  // Сообщение от ассистента
  technical = 2;  // Техническое сообщение
  document_redirect = 3; // Сообщение о том, что нужно переадресовать пользователя на страницу конструктора документов
  extra_questions = 4; // Сообщение с дополнительными вопросами

}

// Enum для статуса сообщения
enum MessageStatus {
  OK = 0;                  // Сообщение обработано без ошибок
  ERROR = 1;               // Произошла ошибка при обработке сообщения
}

message MessageV2 {
  string text = 1; // Текст сообщения
  MessageRole role = 2; // Роль отправителя сообщения
  optional uint32 chat_id = 3;
  optional uint32 msg_id = 4;
  MessageStatus status = 5;   // Статус сообщения
  string errorDetails = 6;    // Описание ошибки, если статус == ERROR
}

message GetConversationRequest{
  uint32 id = 1;
}

message GetConversationResponse{
  repeated Message messages = 1;
  string chat_name = 2;
}



// Данные для запроса регистрации пользователя
message SignUPRequest {
  google.protobuf.StringValue email = 1; // Почта
  google.protobuf.StringValue password = 2; // Пароль
}

message SignUPResponse {
  string email = 1;
}

// Данные для запроса авторизации пользователя
message LoginRequest {
  google.protobuf.StringValue email = 1; // Почта
  google.protobuf.StringValue password = 2; // Пароль
}

message LoginResponse {
  string email = 1;
}


// Данные для запроса проверки авторизации пользователя
message CheckLoginRequest {
}

// Данные для ответа на запрос проверки авторизации пользователя
message CheckLoginResponse {
  bool is_logged = 1;
  google.protobuf.StringValue email = 2; // Почта
}


// Данные для создания категории документов
message AddDocumentCategoryRequest {
  string category_name = 1;
}

// Ответ при создании категории документов
message AddDocumentCategoryResponse {

}


// Данные для создания типов документов
message AddDocumentTypesRequest {
  string category_name = 1;
  repeated string type_names = 2;
}

// Ответ при создании типов документов
message AddDocumentTypesResponse {

}


// Ответ при создании вариантов документов
message AddDocumentVariantsResponse {

}