name: production

on:
  workflow_dispatch:
jobs:
  build:
    name: "Build and push container"
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ github.workspace }}/build/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/speranskiy_backend:latest
            ${{ secrets.DOCKER_USERNAME }}/speranskiy_backend:${{ github.sha }}

  deploy:
    name: Deploy
    needs: [ build ]
    environment: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Условие для запуска только из ветки main
    steps:
      - name: Check if the workflow was triggered manually and from the correct branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Deployments to production are only allowed from the main branch."
            exit 1
          fi
      - name: Set the Kubernetes context
        uses: azure/k8s-set-context@v2
        with:
          method: service-account
          k8s-url: https://194.67.103.165:6443
          k8s-secret: ${{ secrets.KUBERNETES_SECRET }}

      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Deploy to the Kubernetes cluster
        uses: azure/k8s-deploy@v1
        with:
          namespace: default
          manifests: |
            kubernetes/production/deployment.yaml
            kubernetes/production/ingress.yaml
            kubernetes/production/service.yaml
          images: |
            dockerhub.timeweb.cloud/${{ secrets.DOCKER_USERNAME }}/speranskiy_backend:${{ github.sha }}
