name: staging

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: "Build and push container"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ github.workspace }}/build/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/speranskiy_backend:latest
            ${{ secrets.DOCKER_USERNAME }}/speranskiy_backend:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  deploy:
    name: Deploy to Staging
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Set the Kubernetes context
        uses: azure/k8s-set-context@v2
        with:
          method: service-account
          k8s-url: https://194.67.103.165:6443
          k8s-secret: ${{ secrets.KUBERNETES_SECRET }}

      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Deploy to the Kubernetes cluster
        uses: azure/k8s-deploy@v1
        with:
          namespace: default
          wait-for-stability: true
          wait-for-service: false
          manifests: |
            kubernetes/staging/deployment.yaml
            kubernetes/staging/ingress.yaml
            kubernetes/staging/service.yaml
          images: |
            dockerhub.timeweb.cloud/${{ secrets.DOCKER_USERNAME }}/speranskiy_backend:${{ github.sha }}
